<!DOCTYPE html>
<html>
<head>
  <title>Neha's Budget Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f7f9fc; padding: 30px; color: #111827; }
    .card { background: white; padding: 24px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    input, button { padding: 12px; border-radius: 10px; border: 1px solid #ccc; font-size: 16px; }
    button { background: #0b5cff; color: white; border: none; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: center; }
    th { background: #eef4ff; }
  </style>
</head>
<body>

  <h1>💙 Neha's Budget Tracker</h1>

  <div class="card">
    <h2>Log Spending</h2>

    <label>Select Date</label><br>
    <input type="date" id="date"><br><br>

    <label>Amount Spent</label><br>
    <input type="number" id="spent" placeholder="0"><br><br>

    <label>Remarks</label><br>
    <input type="text" id="remarks" placeholder="Fuel, groceries, coffee, etc."><br><br>

    <button onclick="saveEntry()">Save Entry</button>
  </div>

  <div class="card">
    <h2>Spending History</h2>
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Daily Budget</th>
          <th>Spent</th>
          <th>Remarks</th>
          <th>Remaining</th>
          <th>Running Balance</th>
        </tr>
      </thead>
      <tbody id="history"></tbody>
    </table>
  </div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwHZNuSLMtMRHoPZEAkOYzDXIsJI7U5rLl9Cx_ZRsgKYROUSWuEUJMIaL0dczWyvqvi/exec";

async function loadData() {
  const response = await fetch(API_URL);
  const data = await response.json();

  const table = document.getElementById("history");
  table.innerHTML = "";

  data.forEach(row => {
    table.innerHTML += `
      <tr>
        <td>${row.Date || ""}</td>
        <td>${row["Daily Budget"] || ""}</td>
        <td>${row.Spent || ""}</td>
        <td>${row.Remarks || ""}</td>
        <td>${row.Remaining || ""}</td>
        <td>${row["Running Balance"] || ""}</td>
      </tr>
    `;
  });
}

async function saveEntry() {
  const date = document.getElementById("date").value;
  const spent = document.getElementById("spent").value || 0;
  const remarks = document.getElementById("remarks").value || "";

  await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ date, spent, remarks })
  });

  alert("Saved!");
  loadData();
}

loadData();
</script>

</body>
</html>
