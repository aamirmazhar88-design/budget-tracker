<!DOCTYPE html>
<html>
<head>
  <title>Neha's Budget Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f9fc;
      padding: 30px;
      color: #111827;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }

    input, button {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background: #0b5cff;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #004ee0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }

    th {
      background: #eef4ff;
    }

    .error {
      color: red;
      font-weight: bold;
      margin-top: 10px;
    }

    .success {
      color: green;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <h1>💙 Neha's Budget Tracker</h1>

  <div class="card">
    <h2>Log Spending</h2>

    <label>Select Date</label><br>
    <input type="date" id="date"><br><br>

    <label>Amount Spent</label><br>
    <input type="number" id="spent" placeholder="0" step="0.01"><br><br>

    <label>Remarks</label><br>
    <input type="text" id="remarks" placeholder="Fuel, groceries, coffee, etc."><br><br>

    <button onclick="saveEntry()">Save Entry</button>

    <div id="message"></div>
  </div>

  <div class="card">
    <h2>Spending History</h2>

    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Daily Budget</th>
          <th>Spent</th>
          <th>Remarks</th>
          <th>Remaining</th>
          <th>Running Balance</th>
        </tr>
      </thead>
      <tbody id="history"></tbody>
    </table>
  </div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwHZNuSLMtMRHoPZEAkOYzDXIsJI7U5rLl9Cx_ZRsgKYROUSWuEUJMIaL0dczWyvqvi/exec";

function money(value) {
  if (value === "" || value === null || value === undefined) return "";
  return "$" + Number(value).toFixed(2);
}

async function loadData() {
  const message = document.getElementById("message");
  const table = document.getElementById("history");

  try {
    const response = await fetch(API_URL);
    const data = await response.json();

    table.innerHTML = "";

    data.forEach(row => {
      table.innerHTML += `
        <tr>
          <td>${row.DateDisplay || row.Date || ""}</td>
          <td>${money(row["Daily Budget"])}</td>
          <td>${money(row.Spent || 0)}</td>
          <td>${row.Remarks || ""}</td>
          <td>${money(row.Remaining)}</td>
          <td>${money(row["Running Balance"])}</td>
        </tr>
      `;
    });

  } catch (error) {
    table.innerHTML = "";
    message.className = "error";
    message.innerText = "Could not load data. Check Apps Script deployment.";
  }
}

async function saveEntry() {
  const message = document.getElementById("message");
  const date = document.getElementById("date").value;
  const spent = document.getElementById("spent").value || 0;
  const remarks = document.getElementById("remarks").value || "";

  if (!date) {
    message.className = "error";
    message.innerText = "Please select a date.";
    return;
  }

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({
        date: date,
        spent: spent,
        remarks: remarks
      })
    });

    const result = await response.json();

    if (result.status === "success") {
      message.className = "success";
      message.innerText = "Saved successfully!";
      document.getElementById("spent").value = "";
      document.getElementById("remarks").value = "";
      loadData();
    } else {
      message.className = "error";
      message.innerText = result.message || "Something went wrong.";
    }

  } catch (error) {
    message.className = "error";
    message.innerText = "Could not save. Check Apps Script deployment.";
  }
}

loadData();
</script>

</body>
</html>
